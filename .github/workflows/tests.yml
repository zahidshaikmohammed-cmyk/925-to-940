name: strategy-tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q config.py strategy_930.py psygrid_client.py run_engine.py bbbbb.py tests/test_strategy_930.py
      - run: python -m unittest tests.test_strategy_930 -v
      - run: python bbbbb.py --self-test
      - run: pytest -q tests/test_strategy_930.py
