name: strategy-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Byte-compile everything
        run: python -m compileall -q .
      - name: Full repository test suite (stdlib unittest discovery, no pytest needed)
        run: python -m unittest discover -s tests -t . -v
      - name: Engine self-tests
        run: |
          python bbbbb.py --self-test
          python old.py --self-test
          python index.py --self-test
          python opt.py --self-test
          python bbbbb_plus.py --self-test
          python 945.py --self-test
      - name: 945 production-scale benchmark (989 stocks, integrated path)
        run: python 945.py --benchmark
      - name: Verify systemd units
        run: systemd-analyze verify deploy/systemd/psygrid-945.timer deploy/systemd/psygrid-945.service
