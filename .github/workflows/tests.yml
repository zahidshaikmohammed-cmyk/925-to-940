name: strategy-tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q config.py strategy_930.py psygrid_client.py run_engine.py bbbbb.py tests/test_strategy_930.py tests/test_run_engine.py
      - run: python -m unittest tests.test_strategy_930 tests.test_run_engine -v
      - run: python bbbbb.py --self-test
      - run: python -m compileall -q old.py tests/test_old.py tests/test_old_manager.py
      - run: python old.py --self-test
      - run: python -m compileall -q index.py tests/test_index.py
      - run: python index.py --self-test
      - run: python -m compileall -q opt.py tests/test_opt.py
      - run: python opt.py --self-test
      - run: python -m compileall -q bbbbb_plus.py tests/test_bbbbb_plus.py
      - run: python bbbbb_plus.py --self-test
      - run: python -m compileall -q 945.py intelligence tests/test_945.py
      - run: python 945.py --self-test
      - run: python 945.py --benchmark
